[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-interp"
version = "0.1.0"
description = "Modular causal interpretability research infrastructure for world-action models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fastwam = [
  "torch>=2.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26",
]

[project.scripts]
wam-interp = "wam_interp.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wam_interp*"]

