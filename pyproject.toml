[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wam_interp"
version = "0.1.0"
description = "Modular causal interpretability research infrastructure for world-action models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fasterwam = [
  "torch>=2.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26,<2",
  "einops>=0.8",
  "Pillow>=10",
  "safetensors>=0.5",
  "transformers>=4.49,<5",
  "huggingface-hub==0.36.2",
  "modelscope>=1.34",
  "tqdm>=4.66",
]
fastwam = [
  "torch>=2.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26,<2",
  "einops>=0.8",
  "Pillow>=10",
  "safetensors>=0.5",
  "transformers>=4.49,<5",
  "modelscope>=1.34",
  "huggingface-hub==0.36.2",
]
lingbot_va = [
  "torch>=2.7",
  "diffusers==0.36.0",
  "accelerate>=1.0",
  "ftfy>=6",
  "transformers>=4.49,<5",
  "einops>=0.8",
  "easydict>=1.9",
  "numpy>=1.26,<2",
  "safetensors>=0.5",
  "huggingface-hub==0.36.2",
]
libero = [
  "numpy>=1.26,<2",
  # LIBERO's BDDL environments depend on the robosuite 1.4 API.
  "robosuite>=1.4.0,<1.5",
  # robosuite 1.4 uses the pre-3.10 mj_fullM signature.
  "mujoco>=3.3,<3.10",
  "bddl==1.0.1",
  "gym==0.25.2",
  "easydict>=1.9",
  "cloudpickle>=2.1",
  "future>=0.18.2",
  "termcolor>=1.1",
  "opencv-python>=4.6",
  "matplotlib>=3.5",
]
all = [
  "torch>=2.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26,<2",
  "einops>=0.8",
  "Pillow>=10",
  "safetensors>=0.5",
  "transformers>=4.49,<5",
  "modelscope>=1.34",
  "huggingface-hub==0.36.2",
  "diffusers==0.36.0",
  "accelerate>=1.0",
  "ftfy>=6",
  "robosuite>=1.4.0,<1.5",
  "mujoco>=3.3,<3.10",
  "bddl==1.0.1",
  "gym==0.25.2",
  "easydict>=1.9",
  "cloudpickle>=2.1",
  "future>=0.18.2",
  "termcolor>=1.1",
  "opencv-python>=4.6",
  "matplotlib>=3.5",
]
[project.scripts]
wam_interp = "wam_interp.main:main"

[tool.setuptools]
packages = [
  "wam_interp",
  "wam_interp.data",
  "wam_interp.evaluations",
  "wam_interp.evaluations.LIBERO",
  "wam_interp.experiments",
  "wam_interp.interventions",
  "wam_interp.models",
  "wam_interp.models.fastwam",
  "wam_interp.models.fastwam.model_code",
  "wam_interp.models.fastwam.model_code.helpers",
  "wam_interp.models.fastwam.model_code.schedulers",
  "wam_interp.models.lingbot_va",
  "wam_interp.models.lingbot_va.model_code",
  "wam_interp.models.fasterwam",
  "wam_interp.models.fasterwam.model_code",
  "wam_interp.models.fasterwam.model_code.helpers",
  "wam_interp.models.fasterwam.model_code.schedulers",
  "wam_interp.tracing",
]

[tool.setuptools.package-dir]
wam_interp = "src"
"wam_interp.data" = "src/data"
"wam_interp.evaluations" = "src/evaluations"
"wam_interp.evaluations.LIBERO" = "src/evaluations/LIBERO"
"wam_interp.experiments" = "src/experiments"
"wam_interp.interventions" = "src/interventions"
"wam_interp.models" = "src/models"
"wam_interp.models.fastwam" = "src/models/fastwam"
"wam_interp.models.fastwam.model_code" = "src/models/fastwam/model_code"
"wam_interp.models.fastwam.model_code.helpers" = "src/models/fastwam/model_code/helpers"
"wam_interp.models.fastwam.model_code.schedulers" = "src/models/fastwam/model_code/schedulers"
"wam_interp.models.lingbot_va" = "src/models/lingbot_va"
"wam_interp.models.lingbot_va.model_code" = "src/models/lingbot_va/model_code"
"wam_interp.models.fasterwam" = "src/models/fasterwam"
"wam_interp.models.fasterwam.model_code" = "src/models/fasterwam/model_code"
"wam_interp.models.fasterwam.model_code.helpers" = "src/models/fasterwam/model_code/helpers"
"wam_interp.models.fasterwam.model_code.schedulers" = "src/models/fasterwam/model_code/schedulers"
"wam_interp.tracing" = "src/tracing"

[tool.setuptools.package-data]
"wam_interp.models.fasterwam.model_code" = ["LICENSE"]
