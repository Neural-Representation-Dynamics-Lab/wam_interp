[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wam_interp"
version = "0.1.0"
description = "Modular causal interpretability research infrastructure for world-action models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
libero_plus = [
  "wand>=0.6",
  "scikit-image>=0.21",
  "numpy>=1.26,<2",
  "robosuite>=1.4.0,<1.5",
  "mujoco==3.3.2",
  "bddl==1.0.1",
  "gym==0.25.2",
  "easydict>=1.9",
  "cloudpickle>=2.1",
  "future>=0.18.2",
  "termcolor>=1.1",
  "opencv-python>=4.6",
  "matplotlib>=3.5",
]
robotwin = [
  "numpy>=1.26,<2",
  "PyYAML>=6",
  "Pillow>=10",
  "transforms3d==0.4.2",
  "trimesh==4.4.3",
  "sapien==3.0.0b1; sys_platform == 'linux'",
  "mplib==0.2.1; sys_platform == 'linux'",
]
fasterwam = [
  "torch>=2.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26,<2",
  "einops>=0.8",
  "Pillow>=10",
  "safetensors>=0.5",
  "transformers>=4.49,<5",
  "huggingface-hub==0.36.2",
  "modelscope>=1.34",
  "tqdm>=4.66",
]
fastwam = [
  "torch>=2.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26,<2",
  "einops>=0.8",
  "Pillow>=10",
  "safetensors>=0.5",
  "transformers>=4.49,<5",
  "modelscope>=1.34",
  "huggingface-hub==0.36.2",
]
longwam = [
  # Upstream Long-WAM validates torch 2.7.x.
  "torch>=2.7,<2.8",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26,<2",
  "einops>=0.8",
  "Pillow>=10",
  "safetensors>=0.5",
  "transformers>=4.49,<5",
  "huggingface-hub==0.36.2",
  "tqdm>=4.66",
  "ftfy>=6",
  "regex",
  "sentencepiece",
  "PyYAML>=6",
]
# Needs transformers 5 and huggingface-hub>=1.5, so it is not in `all`; install it in its own env.
openwam = [
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers>=5.5,<6",
  "huggingface-hub>=1.5,<2",
  "safetensors>=0.8",
  "einops>=0.8",
  "omegaconf>=2.3",
  "PyYAML>=6",
  "numpy>=1.26",
  "Pillow>=10",
  "ftfy>=6.1",
  "regex>=2023.0",
  "modelscope>=1.13",
  "tqdm>=4.66",
]
lingbot_va = [
  "torch>=2.7",
  "diffusers==0.36.0",
  "accelerate>=1.0",
  "ftfy>=6",
  "transformers>=4.49,<5",
  "einops>=0.8",
  "easydict>=1.9",
  "numpy>=1.26,<2",
  "safetensors>=0.5",
  "huggingface-hub==0.36.2",
]
libero = [
  "numpy>=1.26,<2",
  # LIBERO's BDDL environments depend on the robosuite 1.4 API.
  "robosuite>=1.4.0,<1.5",
  # robosuite 1.4 uses the pre-3.10 mj_fullM signature; benchmark_results/ were run on 3.3.2.
  "mujoco==3.3.2",
  "bddl==1.0.1",
  "gym==0.25.2",
  "easydict>=1.9",
  "cloudpickle>=2.1",
  "future>=0.18.2",
  "termcolor>=1.1",
  "opencv-python>=4.6",
  "matplotlib>=3.5",
]
all = [
  "torch>=2.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26,<2",
  "einops>=0.8",
  "Pillow>=10",
  "safetensors>=0.5",
  "transformers>=4.49,<5",
  "modelscope>=1.34",
  "huggingface-hub==0.36.2",
  "diffusers==0.36.0",
  "accelerate>=1.0",
  "ftfy>=6",
  "robosuite>=1.4.0,<1.5",
  "mujoco==3.3.2",
  "bddl==1.0.1",
  "gym==0.25.2",
  "easydict>=1.9",
  "cloudpickle>=2.1",
  "future>=0.18.2",
  "termcolor>=1.1",
  "opencv-python>=4.6",
  "matplotlib>=3.5",
]
[project.scripts]
wam_interp = "wam_interp.main:main"

